<!DOCTYPE html>
<html lang="pt-BR">
<style>
  :root {
    --cor1: #f0f0f0;
    --cor2: #181818;
    --tamanhoFonte1: 18px;
    --tamanhoFonte2: 22px;
    --tamanhoFonte3: 30px;
  }
  body {
    background-color: var(--cor1);
    color: var(--cor2);
    display: flex;
    justify-content: center;
    align-items: center;
    width: -webkit-fill-available;
  }
  img {
    width: -webkit-fill-available;
    height: auto;
  }
  button, p, input, select, textarea {
    font-size: var(--tamanhoFonte1);
    width: -webkit-fill-available;
  } 
  a, label{ 
    font-size: var(--tamanhoFonte2);
  }
  h2 {
    font-size: var(--tamanhoFonte3);
  }
  a {
    background-color: var(--cor1);
    color: var(--cor2);
    cursor: pointer;
  }
  input, button {
    background-color: var(--cor1);
    color: var(--cor2);
    padding: 10px;
    margin: 15px;
  }
  .outline {
    background-color: var(--cor1);
    color: var(--cor2);
    border: 1px solid var(--cor2);
    padding: 10px;
    cursor: pointer;
  }
  header {
    position: fixed;
    top: 0;
  }
</style>
